name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.21'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build provider binaries
      working-directory: ./provider
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        GIT_COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
      run: |
        mkdir -p dist
        LDFLAGS="-X github.com/redhat/terraform-provider-openshift-operator/internal/version.Version=${VERSION} \
                 -X github.com/redhat/terraform-provider-openshift-operator/internal/version.GitCommit=${GIT_COMMIT} \
                 -X github.com/redhat/terraform-provider-openshift-operator/internal/version.BuildDate=${BUILD_DATE}"
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/terraform-provider-openshift_${VERSION}_linux_amd64
        GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/terraform-provider-openshift_${VERSION}_linux_arm64
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/terraform-provider-openshift_${VERSION}_darwin_amd64
        GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/terraform-provider-openshift_${VERSION}_darwin_arm64
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/terraform-provider-openshift_${VERSION}_windows_amd64.exe

    - name: Create checksums
      working-directory: ./provider/dist
      run: |
        sha256sum terraform-provider-openshift_* > terraform-provider-openshift_${GITHUB_REF#refs/tags/}_SHA256SUMS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          provider/dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
