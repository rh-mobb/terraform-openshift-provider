# golangci-lint configuration file
# See https://golangci-lint.run/usage/configuration/

version: 2

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
  skip-files:
    - ".*\\.pb\\.go$"

linters:
  # Enable only stable, commonly available linters
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    check-shadowing: true
  revive:
    rules:
      - name: exported
        severity: warning
      - name: var-naming
        severity: warning
      - name: var-declaration
        severity: warning
      - name: package-comments
        severity: warning
      - name: comment-spacings
        severity: warning

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    # Exclude staticcheck warnings for embedded TLSClientConfig field
    - linters:
        - staticcheck
      source: "^.*TLSClientConfig.*$"
    # Exclude deprecated plugin.Debug warning - still valid for SDK v2
    - linters:
        - staticcheck
      source: "^.*plugin\\.Debug.*$"
  max-issues-per-linter: 0
  max-same-issues: 0
